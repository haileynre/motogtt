name: Build phone and watch APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '8.11.1'
      - name: Check project wiring
        run: python3 tools/check_project.py
      - name: Build, lint and run unit tests
        run: gradle --no-daemon :common:testDebugUnitTest :phone:lintDebug :wear:lintDebug :phone:assembleDebug :wear:assembleDebug
      - name: Verify matching package IDs and signing certificates
        run: python3 tools/verify_apks.py
      - name: Upload installable phone and watch APKs
        uses: actions/upload-artifact@v4
        with:
          name: WristFlick-debug-APKs
          if-no-files-found: error
          path: |
            phone/build/outputs/apk/debug/phone-debug.apk
            wear/build/outputs/apk/debug/wear-debug.apk
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WristFlick-check-reports
          if-no-files-found: ignore
          path: |
            common/build/reports/tests/
            phone/build/reports/lint-results-debug.html
            wear/build/reports/lint-results-debug.html
